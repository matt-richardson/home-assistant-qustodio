add_extra_time:
  name: Add extra time
  description: Grant a profile extra screen time today.
  fields:
    device_id:
      name: Profile
      description: The Qustodio profile to grant extra time to.
      required: true
      selector:
        device:
          integration: qustodio
          multiple: true
    minutes:
      name: Minutes
      description: Minutes of extra time to grant.
      required: true
      example: 15
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
          mode: box
pause_internet:
  name: Pause internet
  description: Pause a profile's internet for a number of minutes.
  fields:
    device_id:
      name: Profile
      description: The Qustodio profile to pause internet for.
      required: true
      selector:
        device:
          integration: qustodio
          multiple: true
    minutes:
      name: Minutes
      description: How long to pause internet for.
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
          mode: box
resume_internet:
  name: Resume internet
  description: Cancel an active internet pause for a profile.
  fields:
    device_id:
      name: Profile
      description: The Qustodio profile to resume internet for.
      required: true
      selector:
        device:
          integration: qustodio
          multiple: true
cancel_extra_time:
  name: Cancel extra time
  description: Clear all of today's extra time for a profile.
  fields:
    device_id:
      name: Profile
      description: The Qustodio profile to clear extra time for.
      required: true
      selector:
        device:
          integration: qustodio
          multiple: true
activate_routine:
  name: Activate routine
  description: Activate a routine for a fixed duration (schedule override).
  fields:
    device_id:
      name: Profile
      description: The Qustodio profile to activate the routine for.
      required: true
      selector:
        device:
          integration: qustodio
          multiple: true
    routine:
      name: Routine
      description: Exact name of the routine to activate.
      required: true
      example: Games allowed
      selector:
        text:
    duration_minutes:
      name: Duration (minutes)
      description: How long to keep the routine active.
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
          mode: box
block_hours:
  name: Block hours
  description: Mark an hour range as blocked on the given weekdays.
  fields:
    device_id:
      name: Profile
      description: The Qustodio profile to block hours for.
      required: true
      selector:
        device:
          integration: qustodio
          multiple: true
    weekdays:
      name: Weekdays
      description: Weekdays the hour range applies to.
      required: true
      selector:
        select:
          multiple: true
          options:
            - value: mon
              label: Monday
            - value: tue
              label: Tuesday
            - value: wed
              label: Wednesday
            - value: thr
              label: Thursday
            - value: fri
              label: Friday
            - value: sat
              label: Saturday
            - value: sun
              label: Sunday
    start_hour:
      name: Start hour
      description: First hour to block (0-23), inclusive.
      required: true
      example: 22
      selector:
        number:
          min: 0
          max: 23
          mode: box
    end_hour:
      name: End hour
      description: Last hour to block (1-24), exclusive.
      required: true
      example: 24
      selector:
        number:
          min: 1
          max: 24
          mode: box
allow_hours:
  name: Allow hours
  description: Mark an hour range as allowed on the given weekdays.
  fields:
    device_id:
      name: Profile
      description: The Qustodio profile to allow hours for.
      required: true
      selector:
        device:
          integration: qustodio
          multiple: true
    weekdays:
      name: Weekdays
      description: Weekdays the hour range applies to.
      required: true
      selector:
        select:
          multiple: true
          options:
            - value: mon
              label: Monday
            - value: tue
              label: Tuesday
            - value: wed
              label: Wednesday
            - value: thr
              label: Thursday
            - value: fri
              label: Friday
            - value: sat
              label: Saturday
            - value: sun
              label: Sunday
    start_hour:
      name: Start hour
      description: First hour to allow (0-23), inclusive.
      required: true
      example: 7
      selector:
        number:
          min: 0
          max: 23
          mode: box
    end_hour:
      name: End hour
      description: Last hour to allow (1-24), exclusive.
      required: true
      example: 22
      selector:
        number:
          min: 1
          max: 24
          mode: box
