[tool.black]
line-length = 120
# No target-version: let black infer it per file. Pinning py314 makes black
# rewrite `except (A, B):` into PEP 758's `except A, B:` across the codebase,
# which is valid but unrelated churn.

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
exclude = [
    "venv/",
    ".venv/",
    "homeassistant_test/",
]

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
